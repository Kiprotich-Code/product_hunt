{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300;1,400;1,500;1,600;1,700;1,800&family=Roboto:ital,wght@0,100;0,300;0,400;0,700;0,900;1,400;1,700;1,900&display=swap"
        rel="stylesheet">

    <!-- BootStrap 5 -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-Doce.min.css' %}">
    <!-- <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet"/> -->

    <!-- Fontasome -->
    <link rel="stylesheet" href="{% static 'css/all.min.css' %}">

    <!-- Main Design CSS -->
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/framewoek.css' %}">
</head>

<body>
    <div class="page d-flex">
        <!-- Start Sidebar -->
        <div class="sidebar bg-white position-relative p-3">
            <div class="main-logo mt-0 mb-4 mb-md-4 m-md-auto">
                <!-- <a href="{% url 'members_dashboard'%}"><img class="ps-lg-2 ps-0" src="{% static 'images/mmtvc_logo.jpeg' %}" alt="KK8"></a> -->
            </div>
            <ul class="list-unstyled p-0 fw-medium">
                <li>
                    <a class="active d-flex text-center text-dark fs-9 mb-2 mb-1 p-2 rounded " href="{% url 'members_dashboard'%}">
                        <i class="fa-regular fa-chart-bar fa-fw align-self-center"></i>
                        <span class="ms-2 d-none d-md-block ">Dashboard</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex text-center text-dark fs-9 mb-2 mb-1 p-2 rounded" href="{% url 'profiles'%}">
                        <i class="fa-regular fa-user fa-fw align-self-center"></i>
                        <span class="ms-2 d-none d-md-block">Members</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex text-center text-dark fs-9 mb-2 mb-1 p-2 rounded" href="{% url 'mb_products' %}">
                        <i class="fa-solid fa-diagram-project fa-fw align-self-center"></i>
                        <span class="ms-2 d-none d-md-block">Products</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex text-center text-dark fs-9 mb-2 mb-1 p-2 rounded" href="{% url 'my_profile'%}">
                        <i class="fa-solid fa-graduation-cap fa-fw align-self-center"></i>
                        <span class="ms-2 d-none d-md-block">My Profile</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex text-center text-dark fs-9 mb-2 mb-1 p-2 rounded" href="{% url 'index'%}">
                        <i class="fa-regular fa-circle-user fa-fw align-self-center"></i>
                        <span class="ms-2 d-none d-md-block">Homepage</span>
                    </a>
                </li>
                <li>
                    <a class="d-flex text-center text-dark fs-9 mb-2 mb-1 p-2 rounded" href="{% url 'signout'%}">
                        <i class="fa-regular fa-file fa-fw align-self-center"></i>
                        <span class="ms-2 d-none d-md-block">Signout</span>
                    </a>
                </li>
            </ul>
        </div>
        <!-- End Sidebar -->
        <div class="content overflow-hidden p-3 w-100">
            <!-- Start Head -->
            <div class="head bg-white p-2 between-flex rounded">
                <div class="search position-relative ">
                    <input class="p-2 ms-1 rounded" type="search" placeholder="Search">
                </div>
                <div class="icons d-flex align-items-center">
                    <span class="notification position-relative">
                        <i class="fa-regular fa-bell fa-lg"></i>
                    </span>
                    <img class="rounded-pill ms-3" src="{{ user.profile.dp.url }}" alt="">
                </div>
            </div>
            <!-- End Head -->

            {% block content %}
            <h1 class="position-relative fw-bold fs-2 ms-3 me-3 mt-3 mb-5">Dashboard</h1>
            <div class="wrapper grid gap-3">
                
            </div>
            {% endblock %}
        </div>
    </div>
    <!-- Fontasome -->
    <script src="{% static 'js/all.min.js' %}"></script>
    <!-- BootStrap 5 -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <!-- Main JS -->
    <script src="{% static 'js/app.js' %}"></script>
    <script src="{% static 'js/index.js'%}"></script>
</body>

</html>
